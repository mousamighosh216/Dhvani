# PostgreSQL for Dhwani. The migration runs automatically on first start.
#   docker compose up -d
#   export DATABASE_URL=postgres://postgres:postgres@localhost:5432/dhwani?sslmode=disable
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dhwani
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dhwani"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
